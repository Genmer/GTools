appId: com.genmer.gtools
productName: GTools
directories:
  output: release
files:
  - out/**
  - package.json
  # 渲染层依赖全被 Vite bundle，运行时零消费；排除后 main 不得有裸依赖导入
  #（electron.vite.config.ts 已 exclude pinyin-pro，tests/packaging-slim.test.ts 守门）
  - "!node_modules/**"
extraResources:
  - from: resources
    to: .
asar: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
mac:
  # 本机无开发者证书，ad-hoc 签名；完全未签名的 app 会被 SMAppService 拒绝，登录项静默失效
  identity: null
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GTools
