appId: com.genmer.gtools
productName: GTools
directories:
  output: release
files:
  - out/**
  - package.json
  # 渲染层依赖全被 Vite bundle，运行时零消费；排除后 main 不得有裸依赖导入
  #（electron.vite.config.ts 已 exclude pinyin-pro，tests/packaging-slim.test.ts 守门）
  - "!node_modules/**"
extraResources:
  - from: resources
    to: .
asar: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
mac:
  # 无开发者证书：ad-hoc 签名（identity null 是整个跳过签名，不是 ad-hoc）。ad-hoc 的登录项在 BTM 按 cdhash 绑定、
  # 更新即失效，靠 login-item 指纹刷新兜底；钥匙串里有受信任的本地自签证书时可改 CSC_NAME 注入换成跨版本稳定身份
  identity: "-"
  # ad-hoc 无 Team ID，hardened runtime 的 library validation 会拒载 Electron Framework，必须关
  hardenedRuntime: false
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GTools
